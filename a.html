<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Havalı Savaş Oyunu</title>
  <style>
    body {
      margin: 0;
      background: radial-gradient(circle, #111, #000);
      overflow: hidden;
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
    }
    #gameArea {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    .player, .enemy {
      position: absolute;
      width: 50px;
      height: 50px;
      border-radius: 10px;
    }
    .player {
      background: cyan;
      box-shadow: 0 0 20px cyan;
    }
    .enemy {
      background: crimson;
      box-shadow: 0 0 20px red;
    }
    #hud {
      position: fixed;
      top: 10px;
      left: 10px;
      font-size: 1.5em;
      text-shadow: 0 0 10px #0ff;
    }
  </style>
</head>
<body>
  <div id="hud">Skor: 0 | Can: 5</div>
  <div id="gameArea">
    <div class="player" id="player"></div>
    <div class="enemy" id="enemy"></div>
  </div>

  <script>
    const player = document.getElementById("player");
    const enemy = document.getElementById("enemy");
    const hud = document.getElementById("hud");

    let score = 0;
    let health = 5;
    let playerX = 200, playerY = 200;
    let enemyX = 600, enemyY = 300;

    function updateHUD() {
      hud.textContent = "Skor: " + score + " | Can: " + health;
    }

    function render() {
      player.style.left = playerX + "px";
      player.style.top = playerY + "px";
      enemy.style.left = enemyX + "px";
      enemy.style.top = enemyY + "px";
    }

    function moveEnemy() {
      const dx = playerX - enemyX;
      const dy = playerY - enemyY;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist > 0) {
        enemyX += dx / dist * 2;
        enemyY += dy / dist * 2;
      }
    }

    function checkCollision() {
      if (Math.abs(playerX - enemyX) < 40 && Math.abs(playerY - enemyY) < 40) {
        health--;
        updateHUD();
        enemyX = Math.random() * window.innerWidth;
        enemyY = Math.random() * window.innerHeight;
        if (health <= 0) {
          alert("Oyun Bitti! Skor: " + score);
          score = 0;
          health = 5;
          updateHUD();
        }
      }
    }

    document.addEventListener("keydown", e => {
      if (e.key === "ArrowUp") playerY -= 20;
      if (e.key === "ArrowDown") playerY += 20;
      if (e.key === "ArrowLeft") playerX -= 20;
      if (e.key === "ArrowRight") playerX += 20;
    });

    enemy.addEventListener("click", () => {
      score++;
      updateHUD();
      enemyX = Math.random() * window.innerWidth;
      enemyY = Math.random() * window.innerHeight;
    });

    function gameLoop() {
      moveEnemy();
      checkCollision();
      render();
      requestAnimationFrame(gameLoop);
    }

    updateHUD();
    gameLoop();
  </script>
</body>
</html>
