<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Ultra Mega Havalı Sayfa</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(270deg, #ff00ff, #00ffff, #ff9900);
      background-size: 600% 600%;
      animation: gradientShift 10s ease infinite;
      font-family: 'Segoe UI', sans-serif;
    }

    @keyframes gradientShift {
      0% {background-position: 0% 50%;}
      50% {background-position: 100% 50%;}
      100% {background-position: 0% 50%;}
    }

    h1 {
      font-size: 4em;
      color: #fff;
      text-shadow: 0 0 10px #ff00ff,
                   0 0 20px #00ffff,
                   0 0 40px #ff9900;
      animation: glowPulse 2s infinite alternate;
    }

    @keyframes glowPulse {
      from {text-shadow: 0 0 10px #ff00ff, 0 0 20px #00ffff;}
      to {text-shadow: 0 0 20px #ff00ff, 0 0 40px #00ffff, 0 0 60px #ff9900;}
    }

    button {
      margin-top: 20px;
      padding: 15px 30px;
      font-size: 1.2em;
      border: none;
      border-radius: 10px;
      background: #000;
      color: #fff;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 0 10px #00ffff;
    }

    button:hover {
      background: #ff00ff;
      box-shadow: 0 0 20px #ff00ff, 0 0 40px #00ffff;
      transform: scale(1.1);
    }
  </style>
</head>
<body>
  <div>
    <h1>🚀 Ultra Mega Havalı HTML 🚀</h1>
    <button>🔥 Tıkla ve Parla 🔥</button>
  </div>
</body>
</html>
